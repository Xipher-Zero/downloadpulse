name: Release Promotion

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'internal-v*'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fully qualified commit SHA to verify and promote
        required: true
        type: string
      target_tag:
        description: Mutable release tag to update (latest, v*, or internal-v*)
        required: true
        type: string
      dry_run:
        description: Verify the complete promotion contract without changing a mutable tag
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: write
  attestations: read

env:
  IMAGE_NAME: ghcr.io/xipher-zero/downloadpulse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECURITY_PREDICATE_TYPE: https://github.com/Xipher-Zero/downloadpulse/attestations/container-security/v1
  RUNTIME_PREDICATE_TYPE: https://github.com/Xipher-Zero/downloadpulse/attestations/candidate-runtime/v1
  BUILD_PROVENANCE_PREDICATE_TYPE: https://slsa.dev/provenance/v1
  # The refs whose runs and signatures may qualify a candidate; spelled
  # identically in image.yml, container-security.yml and
  # candidate-runtime-qualification.yml. A release-ops/* one-shot branch, a
  # pull request or any other ref never qualifies (docs/SUPPLY_CHAIN_POLICY.md 1).
  QUALIFYING_REFS: 'refs/(heads/main|heads/1\.0\.[0-9]+|heads/staging/.+|tags/v.+|tags/internal-v.+)'
  # The same set as a run's head_branch (a branch name, or the tag name of a tag push).
  QUALIFYING_HEAD_BRANCHES: '(main|1\.0\.[0-9]+|staging/.+|v.+|internal-v.+)'

jobs:
  promote:
    name: Verify exact qualified digest and promote mutable tag
    runs-on: ubuntu-latest

    steps:
      - name: Resolve candidate and target
        id: release
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_TARGET: ${{ inputs.target_tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            candidate_sha="$DISPATCH_SHA"
            target_tag="$DISPATCH_TARGET"
            dry_run="$DISPATCH_DRY_RUN"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            candidate_sha="$GITHUB_SHA"
            target_tag="latest"
            dry_run="false"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/internal-v* ]]; then
            candidate_sha="$GITHUB_SHA"
            target_tag="$GITHUB_REF_NAME"
            dry_run="false"
          else
            echo "Unsupported promotion trigger: $GITHUB_REF"
            exit 1
          fi

          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate must be a full 40-character lowercase commit SHA: $candidate_sha"
            exit 1
          fi
          if [[ ! "$target_tag" =~ ^(latest|v[0-9A-Za-z._-]+|internal-v[0-9A-Za-z._-]+)$ ]]; then
            echo "Refusing unsupported mutable target tag: $target_tag"
            exit 1
          fi
          if [ "$dry_run" != "true" ] && [ "$dry_run" != "false" ]; then
            echo "Invalid dry_run value: $dry_run"
            exit 1
          fi

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "source_tag=sha-${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.candidate_sha }}

      - name: Read expected application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify all qualification workflows succeeded for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          # Each required workflow by its NAME and its workflow FILE: a run
          # counts only if it is that file's run (a one-shot or any other
          # workflow calling itself "Image" never does), for a push, on a
          # qualifying branch or tag, for the exact SHA. Every page of runs.
          declare -A required=(
            ["Tests"]=".github/workflows/tests.yml"
            ["Browser Runtime"]=".github/workflows/browser-runtime.yml"
            ["CodeQL"]=".github/workflows/codeql.yml"
            ["Container Security"]=".github/workflows/container-security.yml"
            ["Candidate Runtime Qualification"]=".github/workflows/candidate-runtime-qualification.yml"
            ["Image"]=".github/workflows/image.yml"
          )

          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&event=push&per_page=100"
          missing=()
          for attempt in $(seq 1 120); do
            payload="$(gh api --paginate "$endpoint" --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}')"

            missing=()
            for workflow in "${!required[@]}"; do
              if jq -e \
                --arg name "$workflow" \
                --arg path "${required[$workflow]}" \
                --arg sha "$CANDIDATE_SHA" \
                --arg branches "^${QUALIFYING_HEAD_BRANCHES}$" \
                '.workflow_runs[] | select(.name == $name and .path == $path and .event == "push" and ((.head_branch // "") | test($branches)) and .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
                <<< "$payload" >/dev/null; then
                echo "QUALIFIED: $workflow (${required[$workflow]}) @ $CANDIDATE_SHA"
              else
                missing+=("$workflow")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for successful exact-SHA qualification: ${missing[*]}"
              exit 1
            fi
            echo "Waiting for exact-SHA qualification: ${missing[*]}"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          # BuildKit by digest, never a floating tag (docs/SUPPLY_CHAIN_POLICY.md 1):
          # moby/buildkit:v0.35.1 (buildx-stable-1, the action's default), multi-arch index.
          driver-opts: image=docker.io/moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable source manifest and child identities
        id: source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          source_ref="${IMAGE_NAME}:${SOURCE_TAG}"
          source_digest=""
          manifest_json=""
          for attempt in $(seq 1 12); do
            if inspect="$(docker buildx imagetools inspect "$source_ref" 2>/dev/null)" && \
               manifest_json="$(docker buildx imagetools inspect --raw "$source_ref" 2>/dev/null)"; then
              source_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
              if [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [[ ! "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable source digest for $source_ref"
            exit 1
          fi

          amd64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<< "$manifest_json")"
          arm64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<< "$manifest_json")"
          for value in "$amd64_digest" "$arm64_digest"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing platform child digest: $value"; exit 1; }
          done

          docker pull --platform linux/amd64 "${IMAGE_NAME}@${amd64_digest}"
          image_version="$(docker image inspect "${IMAGE_NAME}@${amd64_digest}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "${IMAGE_NAME}@${amd64_digest}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$image_version" != "$EXPECTED_VERSION" ]; then
            echo "Source OCI version mismatch: expected $EXPECTED_VERSION, got $image_version"
            exit 1
          fi
          if [ "$image_revision" != "$CANDIDATE_SHA" ]; then
            echo "Source OCI revision mismatch: expected $CANDIDATE_SHA, got $image_revision"
            exit 1
          fi

          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
          echo "Verified immutable source: $source_ref@$source_digest"

      - name: Verify signed security and runtime attestations target exact source digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          AMD64_DIGEST: ${{ steps.source.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.source.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          subject="oci://${IMAGE_NAME}@${SOURCE_DIGEST}"

          # verify_signed <escaped workflow file> <predicate type> <output>:
          # the attestation must be signed by that exact workflow of this
          # repository, on a GitHub-hosted runner, for this exact commit
          # (source and workflow digest), from a qualifying ref.
          verify_signed() {
            local workflow="$1" predicate="$2" output="$3"
            local signer="^https://github\.com/Xipher-Zero/downloadpulse/\.github/workflows/${workflow}@(${QUALIFYING_REFS})$"
            gh attestation verify "$subject" \
              -R "$GITHUB_REPOSITORY" \
              --predicate-type "$predicate" \
              --cert-identity-regex "$signer" \
              --source-digest "$CANDIDATE_SHA" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json > "$output.all" || return 1
            # Keep only the attestations whose certificate itself satisfies the
            # policy, so the predicate checks below never read any other one.
            jq \
              --arg sha "$CANDIDATE_SHA" \
              --arg signer "$signer" \
              --arg refs "^(${QUALIFYING_REFS})$" \
              '[.[] | select(.verificationResult.signature.certificate as $c |
                (($c.subjectAlternativeName // "") | test($signer)) and
                (($c.buildSignerURI // "") | test($signer)) and
                (($c.sourceRepositoryRef // "") | test($refs)) and
                $c.sourceRepositoryURI == "https://github.com/Xipher-Zero/downloadpulse" and
                $c.sourceRepositoryDigest == $sha and
                $c.buildSignerDigest == $sha and
                $c.runnerEnvironment == "github-hosted")]' "$output.all" > "$output"
            jq -e 'length > 0' "$output" >/dev/null
          }

          if ! verify_signed 'image\.yml' "$BUILD_PROVENANCE_PREDICATE_TYPE" build-provenance.json; then
            echo "::error::$subject carries no build provenance signed by image.yml for $CANDIDATE_SHA from a qualifying ref. A candidate published before build provenance existed can never be promoted: release from a new source commit."
            exit 1
          fi
          if ! verify_signed 'container-security\.yml' "$SECURITY_PREDICATE_TYPE" security-attestations.json; then
            echo "::error::$subject has no container-security/v1 attestation signed by container-security.yml for $CANDIDATE_SHA from a qualifying ref"
            exit 1
          fi
          if ! verify_signed 'candidate-runtime-qualification\.yml' "$RUNTIME_PREDICATE_TYPE" runtime-attestations.json; then
            echo "::error::$subject has no candidate-runtime/v1 attestation signed by candidate-runtime-qualification.yml for $CANDIDATE_SHA from a qualifying ref"
            exit 1
          fi

          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg manifest "$SOURCE_DIGEST" \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            'any(.[]; .verificationResult.statement.predicate as $p |
              $p.commit_sha == $sha and
              $p.manifest_digest == $manifest and
              $p.platforms["linux/amd64"].digest == $amd64 and
              $p.platforms["linux/amd64"].vulnerability_gate == "passed" and
              $p.platforms["linux/arm64"].digest == $arm64 and
              $p.platforms["linux/arm64"].vulnerability_gate == "passed" and
              $p.result == "success")' security-attestations.json >/dev/null

          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg manifest "$SOURCE_DIGEST" \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            'any(.[]; .verificationResult.statement.predicate as $p |
              $p.commit_sha == $sha and
              $p.manifest_digest == $manifest and
              $p.platforms["linux/amd64"].digest == $amd64 and
              $p.platforms["linux/amd64"].runtime == "passed" and
              $p.platforms["linux/amd64"].non_root == "passed" and
              $p.platforms["linux/arm64"].digest == $arm64 and
              $p.platforms["linux/arm64"].runtime == "passed" and
              $p.platforms["linux/arm64"].non_root == "passed" and
              $p.result == "success")' runtime-attestations.json >/dev/null

          echo "QUALIFIED_DIGEST == PROMOTED_SOURCE_DIGEST: $SOURCE_DIGEST"

      - name: Dry-run promotion contract
        if: steps.release.outputs.dry_run == 'true'
        shell: bash
        run: |
          echo "Dry run complete. Exact-SHA workflows, OCI digest, child digests, and signed qualification attestations are valid."
          echo "No mutable image tag was changed."

      - name: Promote verified digest to mutable release tag
        if: steps.release.outputs.dry_run == 'false'
        shell: bash
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          TARGET_TAG: ${{ steps.release.outputs.target_tag }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          source_ref="${IMAGE_NAME}@${SOURCE_DIGEST}"
          target_ref="${IMAGE_NAME}:${TARGET_TAG}"
          docker buildx imagetools create --tag "$target_ref" "$source_ref"

          target_digest=""
          for attempt in $(seq 1 12); do
            if inspect="$(docker buildx imagetools inspect "$target_ref" 2>/dev/null)"; then
              target_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
              if [ "$target_digest" = "$SOURCE_DIGEST" ]; then break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$target_digest" != "$SOURCE_DIGEST" ]; then
            echo "Promotion digest mismatch: source $SOURCE_DIGEST, target ${target_digest:-<empty>}"
            exit 1
          fi

          docker pull --platform linux/amd64 "$target_ref"
          target_version="$(docker image inspect "$target_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          target_revision="$(docker image inspect "$target_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$target_version" = "$EXPECTED_VERSION"
          test "$target_revision" = "$CANDIDATE_SHA"

          echo "Promoted $target_ref -> $SOURCE_DIGEST"
