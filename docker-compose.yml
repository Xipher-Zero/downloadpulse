# DownloadPulse: all your downloads, one queue.
# Generic bridge-network example, the same as the README's docker run:
#   1. cp .env.example .env    (optional: timezone, user and group, public address)
#   2. docker compose up -d
# The folders below are created beside this file; point them anywhere you like.
# On Unraid: /mnt/user/appdata/downloadpulse/... and PUID=99, PGID=100.
# The image's own health check (GET /api/health) applies; none is needed here.

services:
  downloadpulse:
    image: ghcr.io/xipher-zero/downloadpulse:v1.0.8
    container_name: downloadpulse
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      - ./downloadpulse/config:/app/config
      - ./downloadpulse/data:/app/data
      - ./downloads:/download
    # Each ${NAME:-default} comes from .env beside this file (made from
    # .env.example) when it sets NAME; otherwise the default applies.
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CONFIG_PATH=/app/config/config.json
      - DB_PATH=/app/data/downloadpulse.db
